<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Drag to the Red Line</title>
    <style>
      :root {
        --screen-bg: #ffffff;
        --red: #f14343;
        --shadow: rgba(0, 0, 0, 0.15);
      }

      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--screen-bg);
        font-family: Arial, sans-serif;
      }

      body {
        display: flex;
        align-items: stretch;
        justify-content: center;
      }

      #gameArea {
        position: relative;
        width: 100vw;
        height: 100vh;
        background: var(--screen-bg);
        touch-action: none;
        user-select: none;
        overflow: hidden;
      }

      #piece {
        position: absolute;
        left: 5vw;
        top: 50%;
        width: 132px;
        height: 132px;
        border-radius: 22px;
        background: var(--red);
        box-shadow: 0 8px 18px var(--shadow);
        cursor: grab;
        z-index: 2;
      }

      #piece:active {
        cursor: grabbing;
      }

      #target {
        position: absolute;
        right: 10vw;
        top: 50%;
        width: 56px;
        height: 220px;
        border-radius: 16px;
        background: var(--red);
      }

      #fullscreenButton {
        position: absolute;
        top: 16px;
        right: 16px;
        z-index: 4;
        border: none;
        border-radius: 12px;
        padding: 10px 14px;
        font-size: 16px;
        font-weight: 700;
        color: #ffffff;
        background: rgba(0, 0, 0, 0.72);
      }

      #fullscreenButton.hidden {
        display: none;
      }

      #completionOverlay {
        position: absolute;
        inset: 0;
        display: none;
        background: rgba(255, 255, 255, 0.95);
        z-index: 20;
      }

      #completionOverlay.visible {
        display: block;
      }

      video {
        width: 100%;
        height: 100%;
        object-fit: cover;
        background: #ffffff;
      }

    </style>
  </head>
  <body>
    <div id="gameArea" aria-label="Drag the red square to the red line">
      <button id="fullscreenButton" type="button" aria-label="Open game in full screen">Fullscreen</button>
      <div id="piece" aria-label="Red square" role="button" tabindex="0"></div>
      <div id="target" aria-label="Red target line"></div>
      <div id="completionOverlay" aria-live="polite">
        <video id="finishVideo" playsinline loop></video>
      </div>
    </div>

    <script>
      const gameArea = document.getElementById('gameArea');
      const piece = document.getElementById('piece');
      const target = document.getElementById('target');
      const fullscreenButton = document.getElementById('fullscreenButton');
      const completionOverlay = document.getElementById('completionOverlay');
      const finishVideo = document.getElementById('finishVideo');
      const AUTO_RESTART_MS = 10000;
      const EXTRA_GRAB_RADIUS = 42;
      const FALLBACK_REWARD_VIDEO = 'https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4';
      const REWARD_VIDEOS = [
        'videos/smeshariki-01.mov',
        'videos/smeshariki-2.mov',
        'videos/smeshariki-3.mov',
      ];

      let dragging = false;
      let offsetX = 0;
      let offsetY = 0;
      let restartTimer = null;
      let gameCompleted = false;
      let activePointerId = null;
      let waitForPointerRelease = false;
      let currentRewardVideo = REWARD_VIDEOS[0];
      let mediaPrimed = false;

      function clamp(value, min, max) {
        return Math.min(Math.max(value, min), max);
      }

      function centerVertically(element) {
        const y = (gameArea.clientHeight - element.offsetHeight) / 2;
        element.style.top = `${Math.max(0, y)}px`;
      }

      function setInitialPositions() {
        piece.style.left = `${Math.max(18, gameArea.clientWidth * 0.05)}px`;
        centerVertically(piece);
        centerVertically(target);
      }

      function isTouching() {
        const pieceLeft = piece.offsetLeft;
        const pieceTop = piece.offsetTop;
        const pieceRight = pieceLeft + piece.offsetWidth;
        const pieceBottom = pieceTop + piece.offsetHeight;

        const targetLeft = target.offsetLeft;
        const targetTop = target.offsetTop;
        const targetRight = targetLeft + target.offsetWidth;
        const targetBottom = targetTop + target.offsetHeight;

        return !(
          pieceRight < targetLeft ||
          pieceLeft > targetRight ||
          pieceBottom < targetTop ||
          pieceTop > targetBottom
        );
      }

      function syncFullscreenButton() {
        const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
        const isFullscreen = Boolean(document.fullscreenElement || document.webkitFullscreenElement);
        fullscreenButton.classList.toggle('hidden', isStandalone || isFullscreen);
      }

      async function enterFullscreen() {
        try {
          if (gameArea.requestFullscreen) {
            await gameArea.requestFullscreen();
          } else if (gameArea.webkitRequestFullscreen) {
            gameArea.webkitRequestFullscreen();
          } else {
            alert('For the most app-like experience on iPad, use Share → Add to Home Screen.');
          }
        } catch (_) {
          alert('Fullscreen was blocked. You can still use Share → Add to Home Screen for app mode.');
        }
        syncFullscreenButton();
      }

      function chooseRewardVideo() {
        const videos = REWARD_VIDEOS.length ? REWARD_VIDEOS : [FALLBACK_REWARD_VIDEO];
        const index = Math.floor(Math.random() * videos.length);
        return videos[index];
      }

      function applyRewardVideo(src) {
        finishVideo.src = src;
      }

      function prepareRewardVideo() {
        currentRewardVideo = chooseRewardVideo();
        applyRewardVideo(currentRewardVideo);
        finishVideo.preload = 'auto';
        finishVideo.load();
      }

      function primeMediaPlaybackFromGesture() {
        if (mediaPrimed) {
          return;
        }
        mediaPrimed = true;
        finishVideo.muted = true;
        finishVideo.play().then(() => {
          finishVideo.pause();
          finishVideo.currentTime = 0;
        }).catch(() => {});
      }

      function playRewardVideoWithFallback() {
        const fallbackSrc = FALLBACK_REWARD_VIDEO;
        let switchedToFallback = false;

        function playWithFallbackAudio() {
          finishVideo.muted = false;
          finishVideo.volume = 1;
          finishVideo.play().catch(() => {
            finishVideo.muted = true;
            finishVideo.play().catch(() => {});
          });
        }

        function onErrorOrBlock() {
          if (switchedToFallback || finishVideo.currentSrc.includes(fallbackSrc)) {
            return;
          }
          switchedToFallback = true;
          applyRewardVideo(fallbackSrc);
          finishVideo.preload = 'auto';
          finishVideo.load();
          playWithFallbackAudio();
        }

        applyRewardVideo(currentRewardVideo);
        finishVideo.currentTime = 0;
        finishVideo.onerror = onErrorOrBlock;
        playWithFallbackAudio();
      }

      function restartGame() {
        if (activePointerId !== null) {
          waitForPointerRelease = true;
        }
        gameCompleted = false;
        dragging = false;
        completionOverlay.classList.remove('visible');
        finishVideo.pause();
        finishVideo.currentTime = 0;
        setInitialPositions();
        prepareRewardVideo();
      }

      function finishGame() {
        if (gameCompleted || completionOverlay.classList.contains('visible')) {
          return;
        }

        gameCompleted = true;
        dragging = false;
        if (restartTimer) {
          clearTimeout(restartTimer);
        }
        if (activePointerId !== null) {
          try {
            gameArea.releasePointerCapture?.(activePointerId);
          } catch (_) {}
        }

        completionOverlay.classList.add('visible');
        playRewardVideoWithFallback();
        restartTimer = setTimeout(restartGame, AUTO_RESTART_MS);
      }

      function updatePiecePosition(x, y) {
        const maxX = gameArea.clientWidth - piece.offsetWidth;
        const maxY = gameArea.clientHeight - piece.offsetHeight;

        const left = clamp(x, 0, maxX);
        const top = clamp(y, 0, maxY);

        piece.style.left = `${left}px`;
        piece.style.top = `${top}px`;
        piece.style.transform = 'translateY(0)';

        if (isTouching()) {
          finishGame();
        }
      }

      function isWithinGrabZone(clientX, clientY) {
        const pieceRect = piece.getBoundingClientRect();
        return (
          clientX >= pieceRect.left - EXTRA_GRAB_RADIUS &&
          clientX <= pieceRect.right + EXTRA_GRAB_RADIUS &&
          clientY >= pieceRect.top - EXTRA_GRAB_RADIUS &&
          clientY <= pieceRect.bottom + EXTRA_GRAB_RADIUS
        );
      }

      function pointerMove(event) {
        if (!dragging || gameCompleted) {
          return;
        }
        if (activePointerId !== null && event.pointerId !== activePointerId) {
          return;
        }

        const areaRect = gameArea.getBoundingClientRect();
        const x = event.clientX - areaRect.left - offsetX;
        const y = event.clientY - areaRect.top - offsetY;

        updatePiecePosition(x, y);
      }

      function pointerDown(event) {
        if (gameCompleted || completionOverlay.classList.contains('visible') || waitForPointerRelease) {
          return;
        }
        if (!isWithinGrabZone(event.clientX, event.clientY)) {
          return;
        }

        event.preventDefault();
        primeMediaPlaybackFromGesture();
        activePointerId = event.pointerId;
        dragging = true;
        const pieceRect = piece.getBoundingClientRect();

        offsetX = event.clientX - pieceRect.left;
        offsetY = event.clientY - pieceRect.top;

        gameArea.setPointerCapture?.(event.pointerId);
      }

      function pointerUp(event) {
        if (activePointerId !== null && event.pointerId !== activePointerId) {
          return;
        }
        dragging = false;
        activePointerId = null;
        waitForPointerRelease = false;
      }

      gameArea.addEventListener('pointerdown', pointerDown);
      window.addEventListener('pointermove', pointerMove);
      window.addEventListener('pointerup', pointerUp);
      window.addEventListener('pointercancel', pointerUp);
      fullscreenButton.addEventListener('click', enterFullscreen);
      document.addEventListener('fullscreenchange', syncFullscreenButton);
      document.addEventListener('webkitfullscreenchange', syncFullscreenButton);
      document.addEventListener('fullscreenchange', setInitialPositions);
      document.addEventListener('webkitfullscreenchange', setInitialPositions);

      piece.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          finishGame();
        }
      });

      window.addEventListener('resize', () => {
        if (!dragging) {
          setInitialPositions();
        }
      });

      syncFullscreenButton();
      setInitialPositions();
      prepareRewardVideo();
    </script>
  </body>
</html>
